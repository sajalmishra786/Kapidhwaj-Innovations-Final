<!DOCTYPE html>
<html>
<head>
<style>
  body { 
    background: #FAF8F2; 
    margin: 0; 
    overflow: hidden; 
    height: 100vh; 
  }
  .bell {
    width: 100vw;
    height: 100vh;
    /* Two gradients: Peak on top of Flare */
    background: 
      radial-gradient(85vw 150vh at 50% 100%, 
        #1A1714 0%, 
        #1A1714 74%, 
        #4A1608 81%, 
        #8E2A08 83%, 
        #E2650E 87%, 
        #F7AC22 92%, 
        #FEF7D2 98%, 
        transparent 100%),
      radial-gradient(250vw 80vh at 50% 100%, 
        #1A1714 0%, 
        #1A1714 74%, 
        #4A1608 81%, 
        #8E2A08 83%, 
        #E2650E 87%, 
        #F7AC22 92%, 
        #FEF7D2 98%, 
        transparent 100%);
  }
</style>
</head>
<body>
  <div class="bell"></div>
</body>
</html>
